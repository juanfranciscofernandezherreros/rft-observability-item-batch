services:
  app:
    build:
      context: ./source
    image: rft-observability-item-batch:local
    container_name: rft-observability-item-batch
    ports:
      - "${APP_PORT:-9001}:9001"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:mem:testdb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      APP_JOBS_T32A_END_PERIOD: ${APP_JOBS_T32A_END_PERIOD:-2026-03-31}
      APP_JOBS_T32A_REPORTING_DATE: ${APP_JOBS_T32A_REPORTING_DATE:-2026-04-30}
      APP_OUTPUT_T32A_CSV: /app/output/item32a-output.csv
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9001/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    networks:
      - rft-network

networks:
  rft-network:
    name: rft-observability-item-batch-network
