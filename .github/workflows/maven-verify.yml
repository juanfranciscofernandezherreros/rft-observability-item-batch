name: Maven Verify

on:
  push:
    branches:
      - feature/item32c-sql-batch
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: source/pom.xml

      - name: Maven verify
        run: mvn -B clean verify
