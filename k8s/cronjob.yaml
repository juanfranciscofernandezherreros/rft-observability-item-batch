apiVersion: batch/v1
kind: CronJob
metadata:
  name: emir-refit-batch
  namespace: default          # Cambia al namespace de tu entorno
  labels:
    app: emir-refit-batch
spec:
  # ── Horario ──────────────────────────────────────────────────────────────
  # Formato cron estándar (UTC por defecto en K8s):
  #   "0 2 * * *"   → cada día a las 02:00
  #   "0 8 * * 1"   → cada lunes a las 08:00
  #   "*/30 * * * *" → cada 30 minutos
  schedule: "0 2 * * *"

  # ── Políticas ─────────────────────────────────────────────────────────────
  # Forbid: no lanza un nuevo Job si el anterior aún está corriendo.
  # Útil para evitar ejecuciones concurrentes del mismo batch.
  concurrencyPolicy: Forbid

  # Cuántos Jobs completados/fallidos mantener en historial (para kubectl logs)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # Tiempo máximo (segundos) para lanzar el job si el scheduler se atrasa.
  # Si pasan más de 120s desde la hora programada sin lanzarse, se omite.
  startingDeadlineSeconds: 120

  jobTemplate:
    spec:
      # Nº de reintentos antes de marcar el Job como Failed
      backoffLimit: 2

      # Tiempo máximo total del Job en segundos (1 hora)
      activeDeadlineSeconds: 3600

      template:
        metadata:
          labels:
            app: emir-refit-batch
        spec:
          containers:
            - name: emir-refit-job
              image: my-registry/emir-refit-batch:latest

              # Selecciona qué job ejecutar (nombre del @Bean Job en BatchConfig)
              args:
                - "--spring.batch.job.name=nightlyImportJob"

              # ── Variables de entorno ─────────────────────────────────────
              env:
                # DB desde un Secret de K8s (nunca hardcodees credenciales)
                - name: SPRING_DATASOURCE_URL
                  valueFrom:
                    secretKeyRef:
                      name: batch-db-secret
                      key: url
                - name: SPRING_DATASOURCE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: batch-db-secret
                      key: username
                - name: SPRING_DATASOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: batch-db-secret
                      key: password

              # ── Recursos ─────────────────────────────────────────────────
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"

          # OnFailure: K8s reinicia el Pod si el proceso sale con código != 0
          # (Spring Batch retorna 1 cuando el Job termina en estado FAILED)
          restartPolicy: OnFailure
