server:
  port: 8080
  error:
    include-message: always

spring:
  main:
    banner-mode: off

  application:
    name: rft-clientarea-db-load-api

  #=========================
  # Db configuration
  #=========================
  datasource:
    sql:
      url: "jdbc:sqlserver://mdmtwdctl01.internal.six-group.net;database=int-clientareadb;encrypt=true;trustServerCertificate=true;"
      username:
      password:
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    impala:
      url: jdbc:impala://dh-rftemir-devint-n-master10.rftemir.iq8p-shl0.a0.cloudera.site:443/;ssl=1;transportMode=http;httpPath=dh-rftemir-devint-n/cdp-proxy-api/impala;AuthMech=3;RowsFetchedPerBlock=50;BATCH_SIZE=50
      username:
      password:
      driver-class-name: com.cloudera.impala.jdbc.Driver

  batch:
    jdbc:
      initialize-schema: always
      platform: sqlserver
    job:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect


logging:
  level:
    root: ERROR
    FUNCTIONAL_LOG: info
    "com.sixgroup.refit": INFO
    "org.springframework.jdbc.core.JdbcTemplate": DEBUG
    "org.springframework.jdbc.core.StatementCreatorUtils": TRACE

#=========================
# actuator configuration
#=========================
management:
  endpoints:
    web:
      base-path: "/actuator"
      exposure:
        include: "*"
    enabled-by-default: true
  server:
    port: 9080
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include:
            - readinessState
        liveness:
          include:
            - livenessState
#=========================
# OpenAPI/Swagger configuration
#=========================
springdoc:
  packagesToScan: com.sixgroup
  pathsToMatch: /**
#=========================
# Custom configuration
#=========================
fate:
  backend:
    jwt-secret: REFITSUPERSECRETKEYTHATISATLEAST256BITSLONGTOWORKWITHNEWLIBRARY!
    jwt-expiration: 604800000

migrations:
  configs:
    "trade-status":
      source-schema: "emir_refit_int_transc"
      source-table: "trade_status_switch_enh"
      target-schema: "[int-clientareadb].dbo"
      target-table: "custom_trade_status_switch_enh"
      fetch-size: 1000
      chunk-size: 1000
    "impala-opr-data-base":
      sourceSchema: "emir_refit_int_transc"
      sourceTable: "opr_data"
      targetSchema: "emir_refit_int_externaluser"
      targetTable: "dqi_opr_data_base"
      chunkSize: 10000
      fetchSize: 25000
    "sum-counterparty-load":
      sourceSchema: "emir_refit_int_externaluser"
      sourceTable: "dqi_opr_data_base"
      targetSchema: "[int-clientareadb].dbo"
      targetTable: "custom_opr_data_more_less_open"
      chunkSize: 10000
      fetchSize: 25000
    "summary-open-status-load":
      sourceSchema: "emir_refit_int_transc"
      sourceTable: "opr_data"
      targetSchema: "[int-clientareadb].dbo"
      targetTable: "custom_opr_data_summary_sum"
      chunkSize: 10000
      fetchSize: 25000

api:
  regulation: eu
  env: int
  prefixDatabase: emir_refit
