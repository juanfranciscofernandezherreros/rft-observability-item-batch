server:
  port: 8080

spring:
  application:
    name: emir-refit-batch
  batch:
    job:
      name : t32aJob
      enabled: true
    jdbc:
      initialize-schema: always
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

# ── Springdoc / Swagger UI ──────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── Parámetros de negocio parametrizables (tablas, EEA, valores estáticos) ──
emir:
  tr-code: "TRRGS"
  regulation-reference: "EMIR"
  tables:
    opr-data: "emir_refit_int_transc.opr_data"
    record-status: "emir_refit_int_control_refit.record_status"
    latest-trade-state: "emir_refit_int_transc.latest_trade_state"
    reports-file-outgoing: "emir_refit_int_control_refit.reports_file_outgoing"
    reco-status-enh-hist: "emir_refit_int_reco.reco_status_enh_hist_hdfs"
  eea-countries:
    - AT
    - BE
    - BG
    - CY
    - CZ
    - DE
    - DK
    - EE
    - GR
    - ES
    - FI
    - FR
    - HR
    - HU
    - IE
    - IS
    - IT
    - LI
    - LT
    - LU
    - LV
    - MT
    - NL
    - NO
    - PL
    - PT
    - RO
    - SE
    - SI
    - SK

app:
  impala:
    url: "jdbc:impala://dh-rftemir-devint-n-master10.rftemir.iq8p-shl0.a0.cloudera.site:443/;ssl=1;transportMode=http;httpPath=dh-rftemir-devint-n/cdp-proxy-api/impala;AuthMech=3;AllowSelfSignedCerts=1"
    username: "xxx"
    password: "xxx"
  output:
    delimiter: ";"
    t32a:
      path: "./source/main/resources/TRRGS_EMIR_PR_0_ND_ITEM32A_20260430.csv"
    t32b:
      path: "./source/main/resources/TRRGS_EMIR_PR_0_ND_ITEM32B_20260430.csv"
    t32c:
      path: "./source/main/resources/TRRGS_EMIR_PR_0_ND_ITEM32C_20260430.csv"
    t33a:
      path: "./source/main/resources/TRRGS_EMIR_PR_0_ND_ITEM33A_20260415.csv"

batch:
  schedule:
    cron: "0 0 2 * * *"
  defaults:
    fecha: "2026-04-30"
    endperiod: "2026-03-31"
    t32c-startdate: "2026-01-01 00:00:00.000"
    t32c-enddate: "2026-03-31 00:00:00.000"
    t33a-reporting-date: "2026-04-15"
    t33a-end-date: "2026-03-31"

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
