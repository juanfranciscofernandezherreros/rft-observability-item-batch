spring:
  application:
    name: batch-processing-demo

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: 9001

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

component-config:
  kududb:
    control-refit-schema: PUBLIC
    transc-schema: PUBLIC

  item32:
    item32aproperties:
      initial-total-trades-new: 0
      initial-total-trades-all: 0

app:
  jobs:
    t32a:
      end-period: "2026-03-31"
      reporting-date: "2026-04-30"
  output:
    t32a-csv: output/item32a-output.csv
