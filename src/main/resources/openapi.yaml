openapi: 3.0.3
info:
  title: EMIR REFIT Batch API
  description: >
    API para lanzar y consultar los jobs de reporting regulatorio EMIR REFIT.
    Cada job ejecuta una o varias queries contra Impala y escribe el resultado
    en un CSV. Las fechas se pasan en cada llamada; los nombres de tabla y la
    lista de países EEA se configuran en application.yml (no por API).
  version: 1.0.0
  contact:
    name: Regulatory Reporting
    email: reporting@regis.com
  license:
    name: Internal use only

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Jobs
    description: Lanzamiento y consulta de jobs de reporting EMIR REFIT

paths:
  /api/jobs:
    get:
      tags: [Jobs]
      summary: Listar jobs disponibles
      description: Devuelve los nombres de los jobs que pueden lanzarse.
      operationId: listJobs
      responses:
        '200':
          description: Lista de nombres de job
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["t32aJob", "t32bJob", "t32cJob", "t33aJob"]

  /api/jobs/{jobName}/run:
    post:
      tags: [Jobs]
      summary: Lanzar un job
      description: |
        Lanza el job indicado de forma síncrona y devuelve su estado final.

        Parámetros por job:
          - t32aJob: `fecha`, `endPeriod`
          - t32bJob: `fecha`, `endPeriod`
          - t32cJob: `fecha`, `startDate`, `endDate`
          - t33aJob: `reportingDate`, `endDate`

        `outputPath` es opcional en todos; si se omite se usa la ruta de config.
      operationId: runJob
      parameters:
        - name: jobName
          in: path
          required: true
          description: Nombre del job
          schema:
            type: string
            enum: [t32aJob, t32bJob, t32cJob, t33aJob]
          example: t32aJob
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRunRequest'
            examples:
              t32a:
                summary: T-32a / T-32b
                value:
                  fecha: "2026-04-30"
                  endPeriod: "2026-03-31"
              t32c:
                summary: T-32c
                value:
                  fecha: "2026-04-30"
                  startDate: "2026-01-01 00:00:00.000"
                  endDate: "2026-03-31 00:00:00.000"
              t33a:
                summary: T-33a
                value:
                  reportingDate: "2026-04-15"
                  endDate: "2026-03-31"
      responses:
        '200':
          description: Job ejecutado (ver campo status en la respuesta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'
        '404':
          description: Job desconocido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'

  /api/jobs/executions/{executionId}:
    get:
      tags: [Jobs]
      summary: Consultar estado de una ejecución
      description: Devuelve el estado actual de una ejecución por su executionId.
      operationId: getStatus
      parameters:
        - name: executionId
          in: path
          required: true
          description: ID de la ejecución
          schema:
            type: integer
            format: int64
          example: 42
      responses:
        '200':
          description: Estado de la ejecución
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'
        '404':
          description: No existe ejecución con ese ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunResponse'

components:
  schemas:
    JobRunRequest:
      type: object
      description: Parámetros de ejecución de un job de reporting
      properties:
        fecha:
          type: string
          description: Fecha de reporte / REPORTING_DATE
          example: "2026-04-30"
        endPeriod:
          type: string
          description: Fecha de corte (T-32a, T-32b)
          example: "2026-03-31"
        startDate:
          type: string
          description: Inicio de ventana (T-32c)
          example: "2026-01-01 00:00:00.000"
        endDate:
          type: string
          description: Fin de ventana (T-32c) / enhoriginaldt (T-33a)
          example: "2026-03-31 00:00:00.000"
        reportingDate:
          type: string
          description: REPORTING_DATE para T-33a
          example: "2026-04-15"
        outputPath:
          type: string
          description: Ruta de salida del CSV (opcional)
          example: "/data/out/TRRGS_EMIR_ITEM32A.csv"

    JobRunResponse:
      type: object
      description: Estado de una ejecución de job
      properties:
        executionId:
          type: integer
          format: int64
          example: 42
        instanceId:
          type: integer
          format: int64
          example: 17
        jobName:
          type: string
          example: t32aJob
        status:
          type: string
          description: Estado batch (COMPLETED, FAILED, STARTED, NOT_FOUND, ...)
          example: COMPLETED
        exitCode:
          type: string
          example: COMPLETED
        message:
          type: string
          example: Job lanzado correctamente
